name: Feature Request
description: Propose a new input field, output field, or data-source addition
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Proposing a new filter or a change to how records are classified? Check the README's
        Reliability and Input & Output Schema sections first to confirm this isn't already
        covered by an existing input field.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the real use case this would unblock, not just the feature itself.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What input field, output field, or behavior would you like to see added?
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - New input filter
        - New output field
        - New data-source cross-reference
        - Delta-engine / classification logic change
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Can this already be achieved with existing inputs (e.g. datasets, eventTypes, dateFrom/dateTo)? If so, why isn't that sufficient?
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I confirmed this isn't already possible with an existing input field (see README → Input & Output Schema)
          required: true
        - label: If this proposes a new data source, I confirmed it's openly accessible (no login wall, no CAPTCHA, no registration gate)
          required: false
